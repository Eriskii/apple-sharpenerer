[package]
name = "sharpenerer"
description = "Per-corner, screen-aware window rounding for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eris-inject = { git = "https://github.com/Eriskii/ErisMacInjectLib", tag = "v0.1.2" }
geometry = { path = "../geometry" }
libc = "0.2"
toml_edit = "0.22"
